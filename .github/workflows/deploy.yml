name: 🚀 Deploy to Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger

jobs:
  deploy-hosting:
    name: Deploy Frontend to Firebase Hosting
    runs-on: ubuntu-latest
    environment: FIREBASE_SERVICE_ACCOUNT
    permissions:
      contents: read
      id-token: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🔨 Build project
        run: npm run build
        env:
          NODE_ENV: production

      - name: ✅ Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Error: dist directory not found!"
            exit 1
          fi
          echo "✅ Build output found:"
          ls -la dist/ | head -20
          echo "📊 Total files: $(find dist -type f | wc -l)"

      - name: 🔐 Setup Firebase Service Account
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > $HOME/firebase-service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-service-account.json
          chmod 600 $HOME/firebase-service-account.json

      - name: 🚀 Deploy to Firebase Hosting
        run: |
          npm install -g firebase-tools
          export GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-service-account.json
          firebase use adora-platform2026
          firebase deploy --only hosting:adora-hotels

  deploy-functions:
    name: Deploy Cloud Functions
    runs-on: ubuntu-latest
    environment: FIREBASE_SERVICE_ACCOUNT
    permissions:
      contents: read
      id-token: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 📥 Install Functions dependencies
        working-directory: ./functions
        run: npm ci

      - name: 🔨 Build Functions
        working-directory: ./functions
        run: npm run build

      - name: 🔐 Setup Service Account
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > $HOME/firebase-service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-service-account.json
          chmod 600 $HOME/firebase-service-account.json
          
      - name: 🚀 Deploy Functions
        run: |
          npm install -g firebase-tools
          export GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-service-account.json
          firebase use adora-platform2026
          firebase deploy --only functions
